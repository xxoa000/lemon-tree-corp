services:
  backend:
    build: ./backend
    ports:
      - "${BACK_PORT}:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      INTERVIEW_OLLAMA_URL: ${INTERVIEW_OLLAMA_URL:-http://host.docker.internal:11434}
      INTERVIEW_OLLAMA_MODEL: ${INTERVIEW_OLLAMA_MODEL:-qwen2.5:7b}
      WORKPLACE_LLM_MODE: ${WORKPLACE_LLM_MODE:-ollama}
      TALK_ROOM_LIMIT: ${TALK_ROOM_LIMIT:-1000}
      TALK_TOTAL_LIMIT: ${TALK_TOTAL_LIMIT:-3000}
      TALK_TTL_SECONDS: ${TALK_TTL_SECONDS:-604800}
      WORKPLACE_JWT_SECRET: ${WORKPLACE_JWT_SECRET:-}
      WORKPLACE_PASSWORD: ${WORKPLACE_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
  mysql:
    ports:
      - "${MYSQL_PORT}:3306"
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 15
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
volumes:
  mysql_data:
